services:

  frontend: # Vite + React + TS (TradingView widget script)
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # keeping it as container's copy, so it doesn't get overwritten
    environment:
      - VITE_API_URL=http://localhost:5080 # front -> back
    depends_on:
      - backend

  backend: # Only cs (Finnhub proxy)
    build: ./backend
    ports:
      - "5080:8080"
    environment:
      - FINNHUB_API_KEY=${FINNHUB_API_KEY} # from .env

  postgres:
    image: postgres:17
    container_name: paper-trading-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paper_trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: