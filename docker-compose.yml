services:

  frontend: # Vite + React + TS (TradingView widget script)
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # keeping it as container's copy, so it doesn't get overwritten
    environment:
      - VITE_API_URL=http://localhost:5080 # front -> back
    depends_on:
      - backend

  backend: # Only cs (Finnhub proxy)
    build: ./backend
    ports:
      - "5080:8080"
    environment:
      - FINNHUB_API_KEY=${FINNHUB_API_KEY} # from .env

  db: # Postgres db service (not in use)
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=stocks
      - POSTGRES_USER=stocks
      - POSTGRES_PASSWORD=stocks
    ports:
      - "5434:5432"
